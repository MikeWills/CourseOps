[project]
name = "courseops"
version = "0.3.0"
description = "Web-based APRS tracking and course map for marathon-style events"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aprslib>=0.7.2",
    # KML/KMZ arrives from race organizers and is uploaded through the web UI:
    # untrusted third-party input. Guards entity-expansion attacks that the
    # stdlib XML parser does not.
    "defusedxml>=0.7.1",
    # The web server. Async throughout, which matters because one APRS-IS
    # connection feeds every browser over WebSockets from the same event loop.
    "fastapi>=0.110",
    # Required by FastAPI to accept a file upload, which is how the organizer's
    # KML/KMZ arrives. Not optional and not implied: without it the app raises
    # on startup, so a fresh install from these dependencies alone would not
    # boot at all. Found by installing into an empty virtualenv, which is the
    # only way this class of omission shows up.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Only for producing the Windows download; nothing at runtime needs it, and
# Linux and macOS never build one.
build-exe = ["pyinstaller>=6.0"]

[project.scripts]
courseops = "courseops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The frontend has no build step, so these ARE the application - not artefacts
# of one. Without the static entry a built wheel installs an app whose every
# page 404s, and nobody notices because development uses `pip install -e .`,
# which reads straight from the source tree. Found by building a wheel and
# looking inside it, which is the only thing that shows this.
courseops = ["*.sql", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
