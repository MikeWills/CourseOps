[project]
name = "courseops"
version = "0.1.0"
description = "Web-based APRS tracking and course map for marathon-style events"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aprslib>=0.7.2",
    # KML/KMZ arrives from race organizers and is uploaded through the web UI:
    # untrusted third-party input. Guards entity-expansion attacks that the
    # stdlib XML parser does not.
    "defusedxml>=0.7.1",
    # The web server. Async throughout, which matters because one APRS-IS
    # connection feeds every browser over WebSockets from the same event loop.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
courseops = "courseops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
courseops = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
