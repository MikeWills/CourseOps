<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" role="img"
     aria-label="Course Ops">
  <title>Course Ops</title>
  <!-- The checkpoint pin from the app icon, redrawn by hand so it stays a
       few clean paths: a ring, two signal arcs a side, a tower. Navy ring: for a light surface such as the sign-in page. -->
  <path d="M32 2C16.5 2 4 14.4 4 29.7 4 50 32 78 32 78S60 50 60 29.7C60 14.4 47.5 2 32 2z"
        fill="#0B2545"/>
  <circle cx="32" cy="30" r="21" fill="#FFFFFF"/>
  <!-- Signal arcs, orange on both grounds. -->
  <g fill="none" stroke="#FF6A13" stroke-width="4" stroke-linecap="round">
    <path d="M23.5 22.5a10 10 0 0 0 0 15"/>
    <path d="M18 17.5a17 17 0 0 0 0 25"/>
    <path d="M40.5 22.5a10 10 0 0 1 0 15"/>
    <path d="M46 17.5a17 17 0 0 1 0 25"/>
  </g>
  <!-- Tower: ball, two legs, three braces. -->
  <circle cx="32" cy="18" r="3.2" fill="#0B2545"/>
  <g fill="none" stroke="#0B2545" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 21L25 48M32 21L39 48"/>
    <path d="M28.6 34h6.8M27 40.5h10M25 48h14"/>
    <path d="M28.6 34l8.4 6.5M35.4 34l-8.4 6.5M27 40.5l12 7.5M37 40.5l-12 7.5"/>
  </g>
</svg>
