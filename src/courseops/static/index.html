<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + safe-area insets below: the bottom sheet must clear
     the home indicator on a modern phone, which is where the thumb lives. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Course Ops</title>
<!-- Icons. SVG first for browsers that take it; PNG/ICO for those that do not.
     iOS ignores BOTH the SVG and the web manifest when adding to the home
     screen - it reads apple-touch-icon and the apple-* metas below, so those
     are not redundant. -->
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<link rel="shortcut icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="manifest" href="__MANIFEST_URL__">

<meta name="theme-color" content="#0B2545">
<!-- Standalone on the home screen: no browser chrome, which matters on a phone
     held one-handed for six hours. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Course Ops">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div id="map"></div>

<header id="topbar">
  <div id="brand">
    <img src="/static/logo-pin.svg" alt="">
    <span id="brand-name">Course&nbsp;Ops</span>
  </div>
  <div id="brand-rule"></div>
  <div id="event-name">Loading…</div>
  <div id="conn" class="conn conn--connecting" role="status" aria-live="polite">
    <span id="conn-text">Connecting…</span>
  </div>
</header>

<button id="locate-btn" type="button" title="Show my location"
        aria-label="Show my location" aria-pressed="false">◎</button>
<div id="locate-status" role="status" aria-live="polite" hidden></div>

<button id="sheet-toggle" type="button" aria-expanded="false" aria-controls="sheet">
  <span id="sheet-toggle-label">Layers</span>
  <span id="sheet-badge" hidden></span>
</button>

<section id="sheet" aria-label="Layers and stations">
  <div id="sheet-grip" role="button" tabindex="0" aria-label="Collapse panel"></div>

  <div id="sheet-header">
    <img src="/static/logo-pin.svg" alt="" width="24" height="30">
    <div>
      <div id="brand-name">Course Ops</div>
      <div class="tagline">Track the course, run the net.</div>
    </div>
  </div>

  <div class="sheet-section">
    <h2>Courses</h2>
    <div id="course-list" class="toggle-list"></div>
  </div>

  <div class="sheet-section">
    <h2>Map layers</h2>
    <div id="layer-list" class="toggle-list"></div>
  </div>

  <div class="sheet-section" id="ssid-section" hidden>
    <h2>Needs attention</h2>
    <div id="ssid-alerts"></div>
  </div>

  <div class="sheet-section" id="leader-section">
    <h2>Lead runners</h2>
    <div id="leader-list"></div>
  </div>

  <div class="sheet-section" id="incident-section">
    <h2>Incidents <span id="incident-count" class="muted"></span></h2>
    <button id="incident-add" type="button" hidden>+ Drop a pickup pin</button>
    <p id="incident-hint" class="muted" hidden>Tap the map where the runner is.</p>
    <div id="incident-list"></div>
  </div>

  <div class="sheet-section">
    <h2>Stations <span id="station-count" class="muted"></span></h2>
    <div id="station-list"></div>
  </div>

  <div id="operator-box" class="sheet-section" hidden>
    <h2>Operator</h2>
    <label class="operator-row">
      <span>Your initials</span>
      <input id="operator-initials" type="text" maxlength="12" autocomplete="off"
             spellcheck="false" placeholder="e.g. MW">
    </label>
    <p class="muted">Stamped on status changes so a shift handover can see who
      did what. Not a login.</p>
  </div>

  <p id="role-note" class="muted"></p>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/static/app.js"></script>
</body>
</html>
