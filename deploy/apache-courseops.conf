# Course Ops behind Apache, with Let's Encrypt.
#
# This file is HTTP-ONLY on purpose. Certbot builds the HTTPS vhost from it,
# copying these proxy rules across and adding the certificate lines.
#
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   sudo cp deploy/apache-courseops.conf /etc/apache2/sites-available/courseops.conf
#   sudo sed -i 's/courseops.example.org/YOUR.HOSTNAME/g' \
#            /etc/apache2/sites-available/courseops.conf
#   sudo a2ensite courseops
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d YOUR.HOSTNAME
#
# Then check deploy/apache-courseops-ssl.conf against what certbot generated:
# it does NOT add the forwarded headers or the WebSocket rewrite, and without
# those the map loads and never moves and session cookies lose Secure.
#
# ---------------------------------------------------------------------------
# Why HTTP-only, and why it says so this loudly:
#
# This file used to ship a <VirtualHost *:443> block referencing
# /etc/letsencrypt/live/<host>/fullchain.pem. That certificate does not exist
# until certbot has run, and certbot refuses to run while the config is
# invalid - so enabling the site failed with "SSLCertificateFile does not
# exist", and the documented order could never work. It cost a real deployment
# four rounds of debugging.
# ---------------------------------------------------------------------------
#
# The other thing that is easy to get wrong: WEBSOCKETS.
#
# The live map is fed by a WebSocket at /ws/. A plain ProxyPass sends it to the
# app as an ordinary HTTP request, the upgrade never completes, and the result
# is a map that loads correctly and then never moves - with no error anywhere
# obvious. mod_proxy_wstunnel and the rules below prevent that, and the /ws/
# rules must come BEFORE the catch-all ProxyPass or they never match.

<VirtualHost *:80>
    ServerName courseops.example.org

    # Certbot writes its challenge here; it must not be proxied away.
    ProxyPass /.well-known/acme-challenge/ !
    DocumentRoot /var/www/html

    ProxyPreserveHost On

    # WebSocket first. Certbot copies this block to :443, so these rules have
    # to be here rather than only in the SSL vhost.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8000/$1" [P,L]

    ProxyPass        /ws/ ws://127.0.0.1:8000/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:8000/ws/

    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # An event lasts hours and a WebSocket is idle between position reports,
    # which arrive only every few minutes. The default timeout drops the
    # connection repeatedly; the client reconnects, but each reconnect costs a
    # full state resync for no reason.
    ProxyTimeout 600

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/courseops-error.log
    CustomLog ${APACHE_LOG_DIR}/courseops-access.log combined
</VirtualHost>
