# Course Ops behind Apache, with Let's Encrypt.
#
# Copy to /etc/apache2/sites-available/courseops.conf (Debian/Ubuntu) or
# /etc/httpd/conf.d/courseops.conf (RHEL/Fedora), replace courseops.example.org
# throughout, then:
#
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   sudo a2ensite courseops
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Then obtain the certificate, which rewrites the :443 block below for you:
#
#   sudo certbot --apache -d courseops.example.org
#
# ---------------------------------------------------------------------------
# The one thing that is easy to get wrong: WEBSOCKETS.
#
# The live map is fed by a WebSocket at /ws/. A plain ProxyPass sends it to the
# app as an ordinary HTTP request, the upgrade never completes, and the result
# is a map that loads correctly and then never moves - with no error anywhere
# obvious. mod_proxy_wstunnel and the rewrite below are what prevent that, and
# the /ws/ rules must come BEFORE the catch-all ProxyPass or they never match.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName courseops.example.org

    # Certbot writes its challenge here; it must not be proxied away.
    ProxyPass /.well-known/acme-challenge/ !
    DocumentRoot /var/www/html

    # Everything else goes to HTTPS. Geolocation ("where am I" on the field
    # roles' phones) is blocked by browsers outside a secure context, so plain
    # HTTP is not merely untidy - part of the app does not work.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>


<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName courseops.example.org

    # --- TLS (certbot fills these in) --------------------------------------
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/courseops.example.org/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/courseops.example.org/privkey.pem
    # Include /etc/letsencrypt/options-ssl-apache.conf

    # --- what the app needs to know ----------------------------------------
    #
    # The app is spoken to in plain HTTP on localhost, so without this it
    # cannot tell the browser arrived over HTTPS, and admin session cookies
    # would never be marked Secure. Start it with --behind-proxy so uvicorn
    # honours these.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    ProxyPreserveHost On

    # --- WebSocket: must come first ----------------------------------------
    #
    # Without this the map loads and then silently never updates.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8000/$1" [P,L]

    # Belt and braces for clients that do not set both headers.
    ProxyPass        /ws/ ws://127.0.0.1:8000/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:8000/ws/

    # --- everything else ----------------------------------------------------
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # An event lasts hours and a WebSocket is idle between position reports,
    # which arrive only every few minutes. The default timeout would drop the
    # connection repeatedly; the client reconnects, but each reconnect costs a
    # full state resync for no reason.
    ProxyTimeout 600

    # --- headers ------------------------------------------------------------
    #
    # HSTS is deliberately commented out. It is a good idea, but it is also
    # hard to undo: browsers remember it for max-age, so a certificate problem
    # locks people out rather than degrading. Turn it on once the deployment
    # has been stable through a renewal.
    # Header always set Strict-Transport-Security "max-age=31536000"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    # Access links and the setup URL both carry credentials in the path, so
    # keep them out of anything that leaves this machine.
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  ${APACHE_LOG_DIR}/courseops-error.log
    CustomLog ${APACHE_LOG_DIR}/courseops-access.log combined
</VirtualHost>
</IfModule>
