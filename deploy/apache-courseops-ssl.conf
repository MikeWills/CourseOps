# The HTTPS vhost, AFTER certbot has issued the certificate.
#
# Certbot writes its own <host>-le-ssl.conf by copying the :80 vhost and adding
# the certificate lines. What it copies is nearly right, but two things it does
# not add are the two that matter most here, so compare its file against this
# one and fill in the gaps - or replace its file with this and set the hostname.
#
#   sudo cp deploy/apache-courseops-ssl.conf \
#           /etc/apache2/sites-available/courseops-le-ssl.conf
#   sudo sed -i 's/courseops.example.org/YOUR.HOSTNAME/g' \
#            /etc/apache2/sites-available/courseops-le-ssl.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The two things certbot will not do for you:
#
#   1. X-Forwarded-Proto "https". Certbot copies the :80 vhost, where that
#      header says "http". Left alone, the app believes the browser arrived
#      over plain HTTP and admin session cookies are never marked Secure - in
#      the one deployment where that matters.
#
#   2. The WebSocket rewrite, if your :80 vhost did not have it. Then the map
#      loads perfectly and never updates, with nothing in any log to say why.
#
# Verify both rather than assuming:
#
#   curl -s https://YOUR.HOSTNAME/healthz          -> {"status":"ok",...}
#   sign in, inspect Set-Cookie                    -> contains Secure
#   open a map link, look at the badge top right   -> "Live" in green

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName courseops.example.org

    SSLCertificateFile    /etc/letsencrypt/live/courseops.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/courseops.example.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # The app is spoken to in plain HTTP on localhost, so without these it
    # cannot tell the browser arrived over TLS. Run it with --behind-proxy so
    # uvicorn honours them.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    ProxyPreserveHost On

    # WebSocket MUST come before the catch-all below.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8000/$1" [P,L]

    ProxyPass        /ws/ ws://127.0.0.1:8000/ws/
    ProxyPassReverse /ws/ ws://127.0.0.1:8000/ws/

    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Hours-long event, minutes between position reports. The default timeout
    # would drop an idle socket repeatedly; each reconnect costs a full resync.
    ProxyTimeout 600

    # HSTS is deliberately commented out. It is a good idea and it is also hard
    # to undo - browsers remember it for max-age, so a certificate problem locks
    # people out rather than degrading. Turn it on once the deployment has been
    # stable through a renewal.
    # Header always set Strict-Transport-Security "max-age=31536000"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog  ${APACHE_LOG_DIR}/courseops-error.log
    CustomLog ${APACHE_LOG_DIR}/courseops-access.log combined
</VirtualHost>
</IfModule>
