# Runs on every push and pull request. Nothing here talks to a network: the
# whole suite is fixture-based on purpose, so it is safe to run anywhere.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the suite
        run: pytest -q

      # The packaging is easy to break in a way no test notices, because
      # development installs with -e and reads the source tree. Building a
      # wheel and checking the frontend is inside it is the only thing that
      # catches a static file going missing from the package.
      - name: Build a wheel and check the frontend is in it
        run: |
          pip install build
          python -m build --wheel
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          static = [n for n in names if "/static/" in n]
          if not static:
              sys.exit(f"{wheel} contains no static files - the app would 404 everywhere")
          if not any(n.endswith("schema.sql") for n in names):
              sys.exit(f"{wheel} has no schema.sql - it could not create a database")
          print(f"{wheel}: {len(static)} static files, schema.sql present")
          PY
